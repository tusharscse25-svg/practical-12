<!DOCTYPE html>
<html>
<head>
    <title>My Smart Page</title>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Tahoma&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>

        body {
            margin: 0;
            font-family: Tahoma;
            background-color: #f5f7fa;
        }

        /* Header */
        header {
            background: linear-gradient(to right, teal, lightblue);
            color: white;
            text-align: center;
            padding: 18px;
        }

        /* Container */
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            padding: 15px;
        }

        /* Card */
        .card {
            background: white;
            width: 220px;
            margin: 12px;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 0 8px lightgray;
            transition: 0.3s;
        }

        /* Transform (changed effect) */
        .card:hover {
            transform: rotate(2deg) scale(1.05);
        }

        /* Icons */
        .card i {
            font-size: 28px;
            color: teal;
            margin-bottom: 8px;
        }

        /* Animation (changed style) */
        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }

        .card {
            animation: fadeIn 1.5s;
        }

        /* Responsive */
        @media(max-width:700px) {
            .card {
                width: 90%;
            }
        }

    </style>
</head>

<body>

<header>
    <h2>My Smart Webpage</h2>
    <p>Responsive & Simple Design</p>
</header>

<div class="container">

    <div class="card">
        <i class="fas fa-graduation-cap"></i>
        <h3>Education</h3>
        <p>Focus on learning and growth.</p>
    </div>

    <div class="card">
        <i class="fas fa-camera"></i>
        <h3>Photography</h3>
        <p>Capture beautiful moments.</p>
    </div>

    <div class="card">
        <i class="fas fa-heart"></i>
        <h3>Hobby</h3>
        <p>Spend time doing what you love.</p>
    </div>

    <div class="card">
        <i class="fas fa-bicycle"></i>
        <h3>Fitness</h3>
        <p>Stay healthy and active.</p>
    </div>

</div>

</body>
</html>
